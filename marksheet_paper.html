<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紙のマークシート</title>
<script src="omr_layout.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
:root{
  --am:#1F4D45; --pm:#2A4D72;
  --g1:#F4F5F3; --g2:#E3E5E1; --g3:#B9BDB7; --g4:#6B716C; --g5:#171A18;
  --paper:#FFFFFF; --line:#E3E5E1; --r:10px; --rs:6px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'IBM Plex Sans JP',sans-serif;color:var(--g5);background:var(--g1);-webkit-font-smoothing:antialiased;}
button,select,input{font-family:inherit;}
.topbar{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);height:52px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.app-title{font-size:14px;font-weight:600;letter-spacing:.06em;display:flex;align-items:center;gap:10px;white-space:nowrap;}
.app-title::before{content:"";width:10px;height:10px;background:var(--am);display:inline-block;}
.top-link{font-size:12px;color:var(--g5);border:1px solid var(--g3);border-radius:var(--rs);padding:5px 11px;text-decoration:none;white-space:nowrap;}
.top-link:hover{border-color:var(--g5);}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px 48px;display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:start;}
@media (max-width:820px){ .wrap{grid-template-columns:1fr;} }
.page-head{grid-column:1/-1;padding-bottom:14px;border-bottom:1px solid var(--g5);}
.page-kicker{font-size:11px;letter-spacing:.18em;color:var(--g4);font-weight:600;margin-bottom:6px;}
.page-title{font-size:22px;font-weight:600;letter-spacing:.02em;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;}
.section-label{font-size:11px;font-weight:600;color:var(--g4);letter-spacing:.12em;margin:16px 0 8px;}
.section-label:first-child{margin-top:0;}
input[type=text],input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--g3);border-radius:var(--rs);font-size:14px;background:var(--paper);color:var(--g5);}
input:focus{outline:none;border-color:var(--g5);}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--g3);border-radius:var(--rs);overflow:hidden;}
.seg button{padding:10px 4px;border:none;background:var(--paper);color:var(--g4);font-size:14px;font-weight:500;cursor:pointer;}
.seg button+button{border-left:1px solid var(--g3);}
.seg button.on{background:var(--g5);color:#fff;font-weight:600;}
.seg button.on[data-p=AM]{background:var(--am);} .seg button.on[data-p=PM]{background:var(--pm);}
.hint{font-size:12px;color:var(--g4);line-height:1.7;margin-top:8px;}
.btn-print{margin-top:18px;width:100%;padding:13px;border:none;border-radius:var(--rs);background:var(--g5);color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
.btn-print:hover{opacity:.9;}
.total{font-family:'DM Mono',monospace;font-size:12px;color:var(--g4);margin-top:8px;text-align:right;}
.howto{margin-top:14px;}
.howto li{font-size:12.5px;line-height:1.75;color:var(--g5);margin-left:18px;}
.preview{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;}
.preview-sheets{display:flex;gap:14px;flex-wrap:wrap;}
.preview-sheets .ps{flex:1 1 300px;max-width:440px;border:1px solid var(--g2);box-shadow:0 1px 6px rgba(23,26,24,.08);}
.preview-sheets svg{display:block;width:100%;height:auto;}
.print-area{display:none;}
@page{size:A4 portrait;margin:0;}
@media print{
  body{background:#fff;}
  .topbar,.wrap{display:none!important;}
  .print-area{display:block;}
  .sheet{width:210mm;height:297mm;overflow:hidden;page-break-after:always;break-after:page;}
  .sheet:last-child{page-break-after:auto;break-after:auto;}
  .sheet svg{display:block;width:210mm;height:297mm;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="app-title">紙のマークシート</div>
  <a class="top-link" href="marksheet_scan.html">取り込み（教員）</a>
</div>

<div class="wrap">
  <div class="page-head">
    <div class="page-kicker">言語聴覚士国家試験 模試</div>
    <div class="page-title">用紙の印刷</div>
  </div>

  <div class="card">
    <div class="section-label">模試名（空欄なら手書き）</div>
    <input type="text" id="exam" placeholder="例：第2回 校内模試" oninput="draw()">
    <div class="section-label">時間帯</div>
    <div class="seg" id="partSeg">
      <button data-p="AM" onclick="setPart('AM')">午前</button>
      <button data-p="PM" onclick="setPart('PM')">午後</button>
      <button data-p="BOTH" class="on" onclick="setPart('BOTH')">両方</button>
    </div>
    <div class="section-label">部数（人数）</div>
    <input type="number" id="copies" min="1" max="200" value="5" oninput="draw()">
    <div class="total" id="total"></div>
    <button class="btn-print" onclick="window.print()">印刷する</button>
    <div class="hint">A4・<b>拡大縮小なし（100%）</b>・余白なしで印刷。モノクロでよい。</div>
    <ol class="howto">
      <li>スマホを忘れた学生に配り、HB以上の鉛筆で塗ってもらう</li>
      <li>学生がマークシート画面の「撮って読み込む」で撮影 → 先生の確認待ちになる（まだ提出ではない）</li>
      <li>回収した用紙を <a href="marksheet_scan.html">取り込み画面</a> で見比べて許可すると提出になる。用紙を教員が撮影・スキャンして登録してもよい</li>
    </ol>
  </div>

  <div class="preview">
    <div class="section-label">見本</div>
    <div class="preview-sheets" id="preview"></div>
  </div>
</div>

<div class="print-area" id="printArea"></div>

<script>
let part = 'BOTH';
function setPart(p) {
  part = p;
  document.querySelectorAll('#partSeg button').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  draw();
}
function draw() {
  const exam = document.getElementById('exam').value.trim();
  const n = Math.max(1, Math.min(200, parseInt(document.getElementById('copies').value) || 1));
  const parts = part === 'BOTH' ? ['AM', 'PM'] : [part];
  document.getElementById('preview').innerHTML = parts.map(p => `<div class="ps">${OMR_LAYOUT.svg({ part: p, exam })}</div>`).join('');
  // 印刷：1人分＝午前→午後の順で並べる（両面印刷なら表午前・裏午後）
  const one = parts.map(p => `<div class="sheet">${OMR_LAYOUT.svg({ part: p, exam })}</div>`).join('');
  document.getElementById('printArea').innerHTML = one.repeat(n);
  document.getElementById('total').textContent = `${n * parts.length} 枚`;
}
draw();
</script>
</body>
</html>
