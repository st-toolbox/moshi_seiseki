<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>国家試験過去問対策アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>
<body>

<div id="scrLogin" class="login hidden">
  <div class="brand">国家試験過去問対策アプリ</div>
  <p class="lead">言語聴覚士の国家試験の過去問と、基礎学習（国試の6割を取る範囲を順に学ぶ）。</p>
  <div class="box">
    <p>大学のGoogleアカウント（OEで始まるメール）でログインしてください。</p>
    <p><button class="btn" onclick="signIn()">Googleでログイン</button></p>
    <div class="alert" id="inappNote" hidden></div>
  </div>
</div>

<div id="scrApply" class="login hidden">
  <div class="brand">国家試験過去問対策アプリ</div>
  <div class="box"><div id="applyBody"></div>
  <p><button class="btn sub sm" onclick="signOut()">ログアウト</button></p></div>
</div>

<div id="scrMain" class="app hidden">
  <header class="top">
    <div class="brand">国家試験過去問対策アプリ<span>言語聴覚士・2年生</span></div>
    <div class="facts" id="facts"></div>
    <span class="who"><span id="who"></span><a href="#" onclick="signOut();return false">ログアウト</a></span>
  </header>
  <div class="work">
    <nav class="side" id="side"></nav>
    <div class="main" id="main">
      <div class="pane" id="tab-home"></div>
      <div class="pane hidden" id="tab-ippo"></div>
      <div class="pane hidden" id="tab-drill"></div>
      <div class="pane wide hidden" id="tab-kq"></div>
      <div class="pane hidden" id="tab-paper"></div>
      <div class="pane hidden" id="tab-quiz"></div>
      <div class="pane hidden" id="tab-rec"></div>
    </div>
  </div>
</div>

<div id="viewer" class="viewer hidden">
  <div class="vbar"><button class="btn sub sm" id="vBack">← もどる</button><span class="tt" id="vTitle"></span><span class="mut">基礎学習</span></div>
  <iframe id="frame" title="基礎学習"></iframe>
</div>

<script src="../omr_layout.js"></script>
<script src="../omr_reader.js"></script>
<script src="../omr_ui.js"></script>
<script src="common.js"></script>
<script src="consent.js"></script>
<script src="student.js"></script>
<script src="drill.js"></script>
<script src="print.js"></script>
</body>
</html>
